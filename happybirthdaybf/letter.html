<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letter | Cua xinh gái</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cursor-glow"></div>
    <div class="floating-bg"></div>

    <nav class="navbar glass">
      <a href="index.html" class="logo">Cua xinh gái</a>
      <div class="nav-links"></div>
    </nav>

    <main class="letter-page">
      <div class="envelope-container">
        <section class="envelope reveal" id="envelope">
          <div class="flap"></div>
          <div class="env-body">
            <p>Bấm để nghe</p>
          </div>
        </section>

        <a href="memories.html" class="memories-btn">
          ♡ Xem lại khoảng khắc đẹp ở đây
        </a>
      </div>

      <section class="letter-paper reveal delay-1" id="letterPaper">
        <p class="script-text">Gửi Đại ca của Cua,</p>

        <video id="birthdayVideo" controls playsinline hidden>
          <source src="assets/audi.mp4" type="video/mp4" />
        </video>
      </section>
    </main>

    <footer class="footer"></footer>
    <script src="script.js"></script>
  </body>
</html>
